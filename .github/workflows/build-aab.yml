name: Build signed Android App Bundle

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q ReveilForce_GitHub_AAB.zip -d build-src

          echo "Contenu extrait :"
          find build-src -maxdepth 3 -type f | head -100

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find build-src -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : aucun settings.gradle trouvé."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "Projet Android trouvé : $PROJECT_ROOT"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Prepare signing key
        working-directory: ${{ steps.project.outputs.root }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > upload-keystore.jks

            cat > signing.env <<EOF
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF
          else
            echo "Aucune clé GitHub configurée : génération d'une clé d'upload."

            PASS="$(openssl rand -hex 24)"

            keytool -genkeypair -v \
              -keystore upload-keystore.jks \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ReveilForce, OU=Android, O=ReveilForce, L=France, ST=France, C=FR"

            {
              echo "KEYSTORE_PASSWORD=$PASS"
              echo "KEY_ALIAS=upload"
              echo "KEY_PASSWORD=$PASS"
            } > signing.env
          fi

      - name: Configure release signing
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          cat > signing.gradle <<'EOF'
          def ksFile = file("upload-keystore.jks")
          def props = new Properties()
          def envFile = file("signing.env")

          envFile.withInputStream {
              props.load(it)
          }

          def storePassword = props.getProperty("KEYSTORE_PASSWORD")
          def keyAlias = props.getProperty("KEY_ALIAS")
          def keyPassword = props.getProperty("KEY_PASSWORD")

          android.signingConfigs.create("githubRelease") {
              storeFile = ksFile
              this.storePassword = storePassword
              this.keyAlias = keyAlias
              this.keyPassword = keyPassword
          }

          android.buildTypes.release.signingConfig =
              android.signingConfigs.githubRelease
          EOF

          printf '\napply from: "signing.gradle"\n' >> app/build.gradle

      - name: Build AAB
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          gradle --no-daemon :app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ReveilForce-release
          path: ${{ steps.project.outputs.root }}/app/build/outputs/bundle/release/app-release.aab

      - name: Save generated signing key
        if: ${{ hashFiles('build-src/**/signing.env') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ReveilForce-upload-key
          path: |
            build-src/**/upload-keystore.jks
            build-src/**/signing.env
