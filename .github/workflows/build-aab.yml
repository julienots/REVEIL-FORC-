name: Build signed Android App Bundle

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q ReveilForce_GitHub_AAB.zip -d build-src
          find build-src -maxdepth 3 -type f | head -100

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find build-src -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : aucun settings.gradle trouvé."
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$SETTINGS")
          echo "Projet Android trouvé : $PROJECT_ROOT"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Bump Android version code
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          FILE="app/build.gradle"
          if [ ! -f "$FILE" ]; then FILE="app/build.gradle.kts"; fi
          if [ ! -f "$FILE" ]; then echo "ERREUR : fichier Gradle introuvable."; exit 1; fi
          if grep -qE 'versionCode[[:space:]]+[0-9]+' "$FILE"; then
            sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 2/' "$FILE"
          elif grep -qE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' "$FILE"; then
            sed -i -E 's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 2/' "$FILE"
          else
            echo "ERREUR : versionCode introuvable."; exit 1
          fi
          grep -n "versionCode" "$FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Prepare signing key
        working-directory: ${{ steps.project.outputs.root }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Récupération de la clé d'upload utilisée pour la première release..."
          curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11224001391/zip"             -o /tmp/upload-key.zip

          rm -rf /tmp/upload-key
          mkdir -p /tmp/upload-key
          unzip -q /tmp/upload-key.zip -d /tmp/upload-key

          KEYSTORE=$(find /tmp/upload-key -name "upload-keystore.jks" | head -1)
          ENVFILE=$(find /tmp/upload-key -name "signing.env" | head -1)

          if [ -z "$KEYSTORE" ] || [ -z "$ENVFILE" ]; then
            echo "ERREUR : clé d'upload historique introuvable."
            exit 1
          fi

          cp "$KEYSTORE" upload-keystore.jks
          cp "$ENVFILE" signing.env

          echo "Clé d'upload historique restaurée."

      - name: Configure release signing
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          cat > app/signing.gradle <<'EOF'
          def ksFile = file("../upload-keystore.jks")
          def props = new Properties()
          def envFile = file("../signing.env")
          envFile.withInputStream { props.load(it) }
          def signing = android.signingConfigs.create("githubRelease")
          signing.storeFile = ksFile
          signing.storePassword = props.getProperty("KEYSTORE_PASSWORD")
          signing.keyAlias = props.getProperty("KEY_ALIAS")
          signing.keyPassword = props.getProperty("KEY_PASSWORD")
          android.buildTypes.release.signingConfig = signing
          EOF
          printf '\napply from: "signing.gradle"\n' >> app/build.gradle

      - name: Build AAB
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          gradle --no-daemon :app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ReveilForce-release
          path: ${{ steps.project.outputs.root }}/app/build/outputs/bundle/release/app-release.aab

      - name: Save generated signing key
        if: ${{ hashFiles('build-src/**/signing.env') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ReveilForce-upload-key
          path: |
            build-src/**/upload-keystore.jks
            build-src/**/signing.env
